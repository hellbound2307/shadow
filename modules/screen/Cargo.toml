[package]
name = "shadow-screen"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadow_screen"
crate-type = ["cdylib"]

[dependencies]
shadow = { package = "shadow-core", path = "../../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "time"] }
base64 = "0.21"
