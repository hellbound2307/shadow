[package]
name = "shadow-a11y"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadow_a11y"
crate-type = ["cdylib"]

[dependencies]
shadow-core = { path = "../../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread"] }
