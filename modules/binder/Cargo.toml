[package]
name = "shadow-binder"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadow_binder"
crate-type = ["cdylib"]

[dependencies]
shadow = { package = "shadow-core", path = "../../core" }
anyhow = "1.0"
tokio = { version = "1.38", features = ["process", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"