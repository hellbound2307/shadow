[package]
name = "shadow-fs"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadow_fs"
crate-type = ["cdylib"]

[dependencies]
shadow = { package = "shadow-core", path = "../../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# In a real FUSE impl on Android, we'd use `fuser` or raw JNI `StorageManager` hooks.
# For this skeletal module, we implement direct file I/O operations.
tokio = { version = "1.38", features = ["fs", "io-util", "rt-multi-thread"] }
base64 = "0.21"
