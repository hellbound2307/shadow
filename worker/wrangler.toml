name = "shadow-worker"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Deployed on free workers.dev subdomain
workers_dev = true

[[durable_objects.bindings]]
name = "IMPLANT_STATE"
class_name = "ImplantDO"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "shadow-storage"

[[kv_namespaces]]
binding = "FLEET_CONFIG"
id = "643737e410d94be9b3df5211f74ae474"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImplantDO"]

[vars]
# Operator Ed25519 public key (hex) — used to verify signed RPC commands
OPERATOR_PUBKEY = "24d78e0853641bc3c4799443a75f217eec931d499d2dbb4b5ef1ec1551617a5c"
ENVIRONMENT = "production"
