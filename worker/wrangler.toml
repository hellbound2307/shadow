name = "shadow-v2"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Deployed on free workers.dev subdomain
workers_dev = true

[[durable_objects.bindings]]
name = "IMPLANT_STATE"
class_name = "ImplantDO"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "shadow-storage"

[[kv_namespaces]]
binding = "FLEET_CONFIG"
id = "643737e410d94be9b3df5211f74ae474"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImplantDO"]

[vars]
# Operator Ed25519 public key (hex) — used to verify signed RPC commands.
# Branch deepseek/version2 — rotated identity. Private seed is the vault entry
# SHADOW_V2_OPERATOR_PRIV_SEED_HEX. If you rotate again, update BOTH this value
# and the OPERATOR_PRIV_KEY GitHub secret, or every signed command 403s.
OPERATOR_PUBKEY = "32976c797291239dd20682c474da5b1229b04e7718be2a5edd21853e570ace67"
ENVIRONMENT = "production"
