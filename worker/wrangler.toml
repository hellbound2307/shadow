name = "shadow-worker"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Deployed on free workers.dev subdomain
workers_dev = true

[[durable_objects.bindings]]
name = "IMPLANT_STATE"
class_name = "ImplantDO"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "shadow-storage"

[[kv_namespaces]]
binding = "FLEET_CONFIG"
id = "643737e410d94be9b3df5211f74ae474"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImplantDO"]

[vars]
# Operator Ed25519 public key (hex) — used to verify signed RPC commands.
# Derived from generated_keys/operator_identity.key (raw 32-byte pubkey).
# If you rotate the operator key, update BOTH this value and the OPERATOR_PRIV_KEY
# GitHub secret, or every signed command will be rejected with 403.
OPERATOR_PUBKEY = "741b2ab5f122b830b53e6f48c795cee61d5bafe04b4782efa92e5f0d5ebc0732"
ENVIRONMENT = "production"
