[workspace]
resolver = "2"
members = [
    "core",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

[workspace.dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "process", "signal", "net", "fs"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["rustls-tls-native-roots"] }
tungstenite = "0.21"
arti-client = { version = "1.2", features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream", "cookies"] }
jni = { version = "0.21", features = [] }
libloading = "0.8"
# zeroize removed due to zeroize_derive 1.5+ requiring edition2024 (Rust 1.85+)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = "2"
ed25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
postcard = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["log"] }
anyhow = "1.0"
hex = "0.4"
base64 = "0.21"
rand = { version = "0.8", features = ["std", "getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
parking_lot = "0.12"
dashmap = "5.5"
async-trait = "0.1"
futures = "0.3"
bytes = "1.5"
bitflags = "2.5"
semver = "1.0"
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde", "getrandom"] }
ulid = "1.0"
ciborium = "0.2"