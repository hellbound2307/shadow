[workspace]
resolver = "2"
members = [
    "core",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

[workspace.dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "process", "signal", "net", "fs"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
jni = { version = "0.21", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
anyhow = "1.0"
url = "2.5"
base64 = "0.22"
futures = "0.3"