[package]
name = "shadow-core"
version = "0.2.0"
edition = "2021"
description = "SHADOW Implant Core — Built-in commands edition"
license = "MIT OR Apache-2.0"

[lib]
name = "shadow"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
android_logger = "0.13"
log = "0.4"
anyhow = "1.0"
url = "2.5"
# Binary-safe file transfer: fs_read is text-only (read_to_string fails on
# binary), so downloads/uploads need an encoder that cannot corrupt bytes.
base64 = "0.22"
