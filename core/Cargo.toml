[package]
name = "shadow-core"
version = "0.1.0"
edition = "2021"
description = "SHADOW Implant Core Library"
license = "MIT OR Apache-2.0"

[lib]
name = "shadow"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "process", "signal", "net", "fs"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tungstenite = "0.21"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jni = "0.21"
libloading = "0.8"
zeroize = "1.7"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
anyhow = "1.0"
hex = "0.4"
base64 = "0.21"
rand = { version = "0.8", features = ["std", "getrandom"] }
bytes = "1.5"
url = "2.5"

[build-dependencies]
cc = "1.0"
